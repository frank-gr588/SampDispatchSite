version: '3.9'

services:
  # Backend (.NET 9.0)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sampdispatch-backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - SaMap__ApiKey=${SAMAP_API_KEY:-changeme-key}
      - SaMap__PlayerTtlSeconds=30
      - SaMap__HistoryPath=/app/data/history.jsonl
    volumes:
      - ./data:/app/data
    networks:
      - dispatch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Frontend (React + Express)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sampdispatch-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - dispatch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Nginx with SSL (Let's Encrypt)
  nginx:
    image: nginx:alpine
    container_name: sampdispatch-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./nginx/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - dispatch-network
    restart: unless-stopped

  # Certbot for SSL certificate management
  certbot:
    image: certbot/certbot:latest
    container_name: sampdispatch-certbot
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./nginx/certbot:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    networks:
      - dispatch-network
    restart: unless-stopped

networks:
  dispatch-network:
    driver: bridge

volumes:
  data:
